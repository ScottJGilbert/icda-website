    <script type="module">
      import {
        animate,
        scroll,
        inView,
        stagger,
        spring,
        hover,
        press,
        styleEffect,
        motionValue,
        delay,
        transformValue,
      } from "https://cdn.jsdelivr.net/npm/motion@latest/+esm";

      inView(document.getElementById("pageHeader"), (element) => {
        animate(
          element,
          { opacity: 1, scale: 1 },
          {
            duration: 0.7,
            type: spring,
            bounce: 0.3,
            easing: [0.17, 0.55, 0.55, 1],
          }
        );

        animate(
          document.getElementById("headerPolygon"),
          { scale: 1, opacity: 1 },
          {
            duration: 0.7,
            easing: [0.17, 0.55, 0.55, 1],
          }
        );

        animate(
          document.getElementById("pageHead"),
          { scale: 1, opacity: 1 },
          {
            duration: 0.7,
            easing: [0.17, 0.55, 0.55, 1],
            delay: 0.1,
          }
        );

        animate(
          document.getElementById("pageHeaderTitle"),
          { scale: 1, opacity: 1 },
          {
            duration: 0.7,
            easing: [0.17, 0.55, 0.55, 1],
            delay: 0.1,
          }
        );
        animate(
          document.getElementById("pageHeaderDescription"),
          { scale: 1, opacity: 1 },
          {
            duration: 0.7,
            easing: [0.17, 0.55, 0.55, 1],
            delay: 0.2,
          }
        );

        return () => {
          animate(element, { opacity: 0, scale: 0.9 }),
            animate(document.getElementById("headerPolygon"), { opacity: 0, scale: 0.9 });
            animate(document.getElementById("pageHead"), { opacity: 0, scale: 0.9 });
            animate(document.getElementById("pageHeaderTitle"), { opacity: 0, scale: 0.9 });
            animate(document.getElementById("pageHeaderDescription"), { opacity: 0, scale: 0.9 });
        };
      });

      inView(document.getElementById("resourcesNavigation"), (element) => {
        animate(
          element,
          { opacity: 1, scale: 1 },
          {
            duration: 0.7,
            type: spring,
            bounce: 0.3,
            easing: [0.17, 0.55, 0.55, 1],
          }
        );

        animate(
          document.getElementById("navLink1"),
          { scaleX: 1 , opacity: 1 },
          {
            duration: 0.7,
            easing: [0.17, 0.55, 0.55, 1],
            delay: 0.1,
          }
        );

        animate(
          document.getElementById("navLink2"),
          { scaleX: 1 , opacity: 1 },
          {
            duration: 0.7,
            easing: [0.17, 0.55, 0.55, 1],
            delay: 0.2,
          }
        );

        animate(
          document.getElementById("navLink3"),
          { scaleX: 1 , opacity: 1 },
          {
            duration: 0.7,
            easing: [0.17, 0.55, 0.55, 1],
            delay: 0.3,
          }
        );

        animate(
          document.getElementById("navLink4"),
          { scaleX: 1 , opacity: 1 },
          {
            duration: 0.7,
            easing: [0.17, 0.55, 0.55, 1],
            delay: 0.4,
          }
        );

        return () => {
          animate(element, { opacity: 0, scale: 0.9 }),
            animate(document.getElementById("navLink1"), { scaleX: 0.9, opacity: 0 });
            animate(document.getElementById("navLink2"), { scaleX: 0.9, opacity: 0 });
            animate(document.getElementById("navLink3"), { scaleX: 0.9, opacity: 0 });
            animate(document.getElementById("navLink4"), { scaleX: 0.9, opacity: 0 });
        };
      });


      
      hover(document.getElementsByClassName("resourcesNavigationLink"), (element) => {
        animate(element, { scale: 1.1 });

        return () => animate(element, { scale: 1 });
      });

      press(document.getElementsByClassName("resourcesNavigationLink"), (element) => {
        animate(element, { scale: 0.9 });

        return () => animate(element, { scale: 1 });
      });







    </script>

    <!-- React entry point -->
    <script type="text/babel">
      const mobileRoot = ReactDOM.createRoot(
        document.getElementById("mobile-menu-root")
      );
      mobileRoot.render(<MobileMenu />);

      const headerRoot = ReactDOM.createRoot(document.getElementById("top"));
      headerRoot.render(<TopHeader />);

      const footerRoot = ReactDOM.createRoot(document.getElementById("footer"));
      footerRoot.render(<Footer />);

      function waitForReactAndInitialize() {
        const maxAttempts = 50;
        let attempts = 0;

        const interval = setInterval(() => {
          const headerLinks = document.getElementsByClassName("link");
          const headerMenus = document.getElementById("headerMenus");

          if (headerLinks.length > 0 && headerMenus) {
            clearInterval(interval);
            initialize();
          }

          attempts++;
          if (attempts > maxAttempts) {
            clearInterval(interval);
            console.warn(
              "initialize() timed out waiting for React components."
            );
          }
        }, 100); // check every 100ms
      }

      waitForReactAndInitialize();
    </script>
