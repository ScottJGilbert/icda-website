<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Management | Illinois Congressional Debate Association</title>
    <link rel="icon" href="/public/images/favicon.png" />
    <script src="script.js"></script>
  </head>

  <body>
    <form id="new-user-form">
      <input name="name" type="text" />
      <label for="name">Name</label>
      <input name="username" type="text" />
      <label for="username">Username</label>
      <input name="password" type="password" />
      <label for="password">Password</label>

      <input
        type="radio"
        id="editor"
        name="access_level"
        value="Editor"
        checked="true"
      />
      <label for="poster"
        >Editor (can edit non-post data and upload results/legislation,
        etc.)</label
      ><br />
      <input type="radio" id="poster" name="access_level" value="Poster" />
      <label for="poster"
        >Poster (all editing permissions + creating/updating/deleting
        posts)</label
      ><br />
      <input
        type="radio"
        id="administrator"
        name="access_level"
        value="Administrator"
      />
      <label for="poster">Administrator (all permissions)</label><br />

      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
