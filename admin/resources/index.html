<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Resources | Illinois Congressional Debate Association</title>
    <link rel="icon" href="/public/images/favicon.png" />
    <script src="script.js"></script>
  </head>

  <body>
    <h1>Edit Resources</h1>
    <h2>Edit Rules</h2>
    <div>
      <form id="add-rule">
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Gaveling Procedure"
          required
        />
        <label for="name">Rule Name <span style="color: red">*</span></label>
        <input type="number" id="number" name="number" required />
        <label for="number"
          >Rule Number <span style="color: red">*</span></label
        >
        <textarea
          id="summary"
          name="summary"
          spellcheck="default"
          required
        ></textarea>
        <label for="summary"
          >Rule Summary <span style="color: red">*</span></label
        >
      </form>
      <button onclick="addRule()">Add Rule</button>
    </div>

    <button onclick="updateRules()">Save Rules</button>
    <div id="rules"></div>

    <script src="data-script.js"></script>
  </body>
</html>
