<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit New Website | ICDA</title>
    <link rel="icon" href="/public/images/favicon.png" />
    <link
      rel="stylesheet"
      href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"
    />
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <link rel="stylesheet" href="../post-style.css" />

  </head>

  <body>
    <form id="updatePost">
      <input id="title" name="title" type="text" placeholder="Title" required />
      <label for="title">Title <span style="color: red">*</span></label>
      <input id="image" name="image" type="file" />
      <label for="image">Upload new image</label>

      <input
        id="deleteImage"
        name="deleteImage"
        type="checkbox"
        onchange="checkBox()"
      />
      <label for="deleteImage">Delete associated image</label>
      <!-- Populate this with stuff that can be duplicated -->
      <div id="editor"></div>
    </form>
    <button onclick="save()">Save</button>

    <button
      onclick="deletePost()"
      style="
        color: red;
        padding: 4px;
        border-radius: 4px;
        border: 2px solid red;
      "
    >
      Delete Post
    </button>

    <script src="../posting-script.js"></script>
  </body>
</html>
