<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Members | ICDA</title>
    <link rel="icon" href="/public/images/favicon.png" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="/public/global.css" />
    <script src="/public/global.js"></script>
    <script src="script.js"></script>

    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="mobile-menu-root"></div>
    <div id="top"></div>

    <!-- Everything below is actual page content and varies by file -->

    <div id="mainContent">
      <div id="pageHeader" class="division">
        <section>
          <svg
            width="200"
            height="40"
            style="margin: auto; padding-bottom: 30px"
          >
            <polygon
              points="20 0 200 0 180 40 0 40"
              style="fill: #142039"
            ></polygon>
            <text
              x="52"
              y="29"
              color="white"
              style="fill: white; font-family: langdon, serif; font-size: 30px"
            >
              MEMBERS
            </text>
          </svg>
          <div id="aboutNavigation" style="max-width: 200px">
            <a
              href="../"
              id="aboutNavigationTitle"
              style="border-bottom: black 1px solid"
              ><b>About</b></a
            >
            <a href="../about-icda" class="aboutNavigationLink">About ICDA</a>
            <a href="../congressional-debate" class="aboutNavigationLink"
              >Congressional Debate</a
            >
            <a href="../members" class="aboutNavigationLink">Members</a>
            <a href="../leadership" class="aboutNavigationLink">Leadership</a>
            <a
              href="../how-to-join"
              class="aboutNavigationLink"
              style="padding-bottom: 20px"
              >How do I join?</a
            >
          </div>
          <p class="title" style="font-family: 'Arial Black', serif">
            ICDA Members
          </p>
          <p id="pageHeaderDescription">
            A list (and a map) of all current ICDA member schools and their head
            coaches, if they chose to be listed here. Click on any head coach
            name to email them!
          </p>
        </section>
      </div>
      <div
        class="division"
        style="background-color: #e2f2ff; border-radius: 30px"
      >
        <section style="border: #34518e 4px solid">
          <p class="title" style="text-align: center">Map</p>
          <iframe
            id="memberMap"
            sandbox="allow-scripts allow-popups"
            src="https://www.google.com/maps/d/u/0/embed?mid=1hB_UPzPCWXnJiDeDEEc42shVIAKavnw&ehbc=2E312F"
            height="480"
            style="
              margin: auto;
              display: block;
              width: 640px;
              max-width: 100%;
              border-radius: 30px;
              border: #142039 4px solid;
            "
          ></iframe>
        </section>
      </div>
      <div class="division">
        <section>
          <ul id="list"></ul>
        </section>
      </div>
    </div>

    <!-- Everything above is actual page content and varies by file -->

    <footer id="footer"></footer>

    <!-- React components (Babel-in-browser) -->
    <script type="text/babel" src="/public/components/mobile-menu.jsx"></script>
    <script type="text/babel" src="/public/components/header.jsx"></script>
    <script type="text/babel" src="/public/components/footer.jsx"></script>

    <!-- React entry point -->
    <script type="text/babel">
      const mobileRoot = ReactDOM.createRoot(
        document.getElementById("mobile-menu-root")
      );
      mobileRoot.render(<MobileMenu />);

      const headerRoot = ReactDOM.createRoot(document.getElementById("top"));
      headerRoot.render(<TopHeader />);

      const footerRoot = ReactDOM.createRoot(document.getElementById("footer"));
      footerRoot.render(<Footer />);

      function waitForReactAndInitialize() {
        const maxAttempts = 50;
        let attempts = 0;

        const interval = setInterval(() => {
          const headerLinks = document.getElementsByClassName("link");
          const headerMenus = document.getElementById("headerMenus");

          if (headerLinks.length > 0 && headerMenus) {
            clearInterval(interval);
            initialize();
          }

          attempts++;
          if (attempts > maxAttempts) {
            clearInterval(interval);
            console.warn(
              "initialize() timed out waiting for React components."
            );
          }
        }, 100); // check every 100ms
      }

      waitForReactAndInitialize();
    </script>
  </body>
</html>
